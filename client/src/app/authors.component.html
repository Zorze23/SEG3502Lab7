<h2>Authors</h2>

<form (ngSubmit)="search()">
  <div class="mb-3">
    <label for="authorId" class="form-label">Author ID</label>
    <input
      id="authorId"
      name="authorId"
      type="number"
      min="1"
      step="1"
      class="form-control"
      [(ngModel)]="authorId"
      required
    >
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="loading">
    Search
  </button>
</form>

<p *ngIf="loading" class="mt-3" role="status">Loading...</p>

<p *ngIf="message" class="alert alert-warning mt-3" role="alert">
  {{ message }}
</p>

<div *ngIf="author" class="mt-3">
  <h3>{{ author.firstName }} {{ author.lastName }}</h3>
  <p><strong>ID:</strong> {{ author.id }}</p>

  <h4>Books</h4>

  <ul *ngIf="author.books.length">
    <li *ngFor="let book of author.books">{{ book.title }}</li>
  </ul>

  <p *ngIf="!author.books.length">No books listed for this author.</p>
</div>
